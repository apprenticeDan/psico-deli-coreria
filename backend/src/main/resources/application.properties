spring.application.name=core

# Perfil por defecto: 'sqlite' (preferencia del proyecto)
# Se puede cambiar a 'postgres' definiendo la variable de entorno:
#   SPRING_PROFILES_ACTIVE=postgres
spring.profiles.active=${SPRING_PROFILES_ACTIVE:sqlite}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
